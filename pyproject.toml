[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bitaxe-mcp"
version = "0.1.0"
description = "BitAXE Gamma MCP Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "nuxnik" },
]
keywords = ["bitcoin", "asic-miner", "bitaxe", "mcp", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.28.1,<2",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
bitaxe-mcp = "bitaxe_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bitaxe_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
